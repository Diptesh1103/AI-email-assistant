<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quill – AI email assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef1;--panel:#f7f9fa;--ink:#17242d;--mute:#5d6e79;--line:#cdd7dd;--accent:#0e6b66;--accent-ink:#fff;--paper:#fffefb;--err:#a3321f}
@media (prefers-color-scheme:dark){:root{--bg:#10181d;--panel:#18232a;--ink:#e6edf0;--mute:#8da0ab;--line:#2b3a43;--accent:#46b3a9;--accent-ink:#06201e;--paper:#1d2a31;--err:#ff8c78}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
header{max-width:1100px;margin:0 auto;padding:28px 20px 8px}
h1{margin:0;font-size:1.9rem;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--mute)}
main{max-width:1100px;margin:0 auto;padding:16px 20px 40px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 13px;border-radius:999px;font:inherit;font-size:.92rem;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
label{font-size:.88rem;color:var(--mute)}
textarea,select,input{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:230px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 2fr;gap:10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.paper{flex:1;min-height:320px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px 24px;font:1.08rem/1.65 Newsreader,Georgia,serif;white-space:pre-wrap;overflow:auto;box-shadow:inset 4px 0 0 var(--accent)}
.paper.empty{color:var(--mute);font-style:italic}
.paper.error{color:var(--err);font-style:normal}
.bar{display:flex;justify-content:space-between;align-items:center}
.bar button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
@media(prefers-reduced-motion:no-preference){.paper.fresh{animation:in .35s ease-out}@keyframes in{from{opacity:.2;transform:translateY(6px)}}}
</style>
</head>
<body>
<header><h1>Quill</h1><p>Write, reply to and tidy up email in seconds.</p></header>
<main>
  <section class="panel" aria-label="Input">
    <div class="tabs" id="tabs" role="group" aria-label="What do you need?"></div>
    <label for="content" id="contentLabel"></label>
    <textarea id="content"></textarea>
    <div class="row">
      <div><label for="tone">Tone</label>
        <select id="tone"><option>professional</option><option>friendly</option><option>formal</option><option>concise</option><option>apologetic</option><option>persuasive</option></select></div>
      <div><label for="instr">Extra instructions (optional)</label>
        <input id="instr" placeholder="e.g. mention the Friday deadline"></div>
    </div>
    <button class="go" id="go"></button>
  </section>
  <section class="panel" aria-label="Result">
    <div class="bar"><label>Result</label><button id="copy" hidden>Copy</button></div>
    <div class="paper empty" id="out" aria-live="polite">Your result will appear here.</div>
  </section>
</main>
<script>
const MODES={
  draft:{tab:"Write email",label:"What should the email say? Rough notes are fine.",btn:"Write email"},
  reply:{tab:"Reply",label:"Paste the email you received.",btn:"Write reply"},
  improve:{tab:"Improve",label:"Paste your draft.",btn:"Improve email"},
  summarize:{tab:"Summarize",label:"Paste a long email or thread.",btn:"Summarize"},
  subjects:{tab:"Subject lines",label:"Paste the email body.",btn:"Suggest subject lines"}
};
let mode="draft";
const $=id=>document.getElementById(id);
function setMode(m){
  mode=m;const c=MODES[m];
  $("contentLabel").textContent=c.label;$("go").textContent=c.btn;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
  $("tone").disabled=(m==="summarize"||m==="subjects");
}
Object.entries(MODES).forEach(([k,v])=>{
  const b=document.createElement("button");b.textContent=v.tab;b.dataset.m=k;
  b.onclick=()=>setMode(k);$("tabs").appendChild(b);
});
setMode("draft");
function show(text,cls){const o=$("out");o.textContent=text;o.className="paper "+cls;$("copy").hidden=cls!=="fresh"}
$("go").onclick=async()=>{
  const content=$("content").value.trim();
  if(!content){show("Add some text first.","error");return}
  const go=$("go"),label=go.textContent;go.disabled=true;go.textContent="Working…";
  try{
    const r=await fetch("/api/email/assist",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:mode,tone:$("tone").value,content,instructions:$("instr").value})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Something went wrong.");
    show(d.result,"fresh");
  }catch(e){show(e.message,"error")}
  go.disabled=false;go.textContent=label;
};
$("copy").onclick=async()=>{
  await navigator.clipboard.writeText($("out").textContent);
  $("copy").textContent="Copied";setTimeout(()=>$("copy").textContent="Copy",1500);
};
</script>
</body>
</html>
